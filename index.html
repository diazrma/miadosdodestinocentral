<!DOCTYPE html>
<html lang="pt-BR"><head><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#17130f"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miados do Destino · Central do Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--cd:#fffaf0;--bd:#e0d2b8;--fg:#2a2118;--mut:#7d6d55;--gd:#c98f0a;--ok:#2f8a4f;--no:#b9452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--cd:#231c15;--bd:#3a2e20;--fg:#f3e8d6;--mut:#a8977c;--gd:#f5c84b;--ok:#6fcf8f;--no:#ef8a72}}
:root[data-theme="dark"]{--bg:#17130f;--cd:#231c15;--bd:#3a2e20;--fg:#f3e8d6;--mut:#a8977c;--gd:#f5c84b;--ok:#6fcf8f;--no:#ef8a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at top,rgba(245,200,75,.10),transparent 60%);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0 0 8px}h2{font-size:26px}h3{font-size:20px;color:var(--gd)}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd)}
header>img{height:58px;background:#17130f;padding:6px 14px;border-radius:12px}nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--gd)}button.on,button.pr{background:var(--gd);color:#17130f;border-color:var(--gd);font-weight:600}
main{max-width:1020px;margin:0 auto;padding:18px;overflow-x:hidden}section{display:none}section.on{display:block}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k b{display:block;font:700 28px "Cormorant Garamond",Georgia,serif;color:var(--gd)}.k span{color:var(--mut);font-size:13px}
.up{color:var(--ok);font-size:12px}.dn{color:var(--no);font-size:12px}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.r>*{flex:1 1 130px}.sp{margin-top:16px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gd);flex:none}
.pk{display:flex;gap:8px;flex-wrap:wrap}.pk label{cursor:pointer;flex:none}.pk input{display:none}.pk img{width:48px;height:48px;border-radius:50%;object-fit:cover;opacity:.45;border:2px solid transparent}.pk input:checked+img{opacity:1;border-color:var(--gd)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:500}
.ov{overflow-x:auto}.ch{width:100%;height:auto}.em{text-align:center;padding:26px;color:var(--mut)}.em img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:8px}
#fb{white-space:pre-wrap;line-height:1.65}.mut{color:var(--mut)}textarea{width:100%;min-height:80px}
@media print{header,nav,.no-p{display:none!important}}
.pg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.pc{padding:0;overflow:hidden}.pc img,.pc .ni{width:100%;aspect-ratio:1;object-fit:cover;display:block}.ni{display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bd)}.pi{padding:10px;font-size:13px;display:grid;gap:4px}.pi select{width:100%;font-size:13px}</style></head><body>

(()=>{const st=document.createElement('style');st.textContent=`#avisos{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;display:grid;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.aviso{pointer-events:auto;background:#211a13;color:#efe6d2;border:1px solid #e2b55a66;border-left:4px solid #e2b55a;border-radius:12px;padding:12px 38px 12px 14px;font:14px/1.45 Inter,system-ui,sans-serif;box-shadow:0 12px 30px #0007;white-space:pre-line;position:relative;animation:avIn .2s ease-out}
.aviso.err{border-left-color:#ef8a72}.aviso button{position:absolute;top:6px;right:6px;background:none;border:0;color:#bfae90;font-size:18px;cursor:pointer;min-height:0;padding:2px 6px}
.aviso textarea{display:block;width:100%;margin-top:8px;min-height:90px;background:#120d08;color:#efe6d2;border:1px solid #3a2e20;border-radius:8px;padding:8px;font:13px Inter,sans-serif}
@keyframes avIn{from{opacity:0;transform:translateY(8px)}}`;document.head.appendChild(st)})();
function aviso(msg,{erro,texto,tempo}={}){let box=document.getElementById('avisos');if(!box){box=document.createElement('div');box.id='avisos';document.body.appendChild(box)}
 const d=document.createElement('div');d.className='aviso'+(erro?' err':'');d.textContent=String(msg??'');const x=document.createElement('button');x.textContent='×';x.onclick=()=>d.remove();d.appendChild(x);
 if(texto!=null){const t=document.createElement('textarea');t.value=texto;t.readOnly=true;d.appendChild(t);setTimeout(()=>t.select(),50)}
 box.appendChild(d);if(texto==null)setTimeout(()=>d.remove(),tempo||(erro?8000:4500));}
window.alert=m=>aviso(m,{erro:/n[ãa]o |erro|falh|inv[áa]lid|sem permiss|confira/i.test(String(m))});
{const p0=window.prompt.bind(window);window.prompt=(m,v)=>{if(v===undefined)return p0(m);aviso(m,{texto:String(v)});return null}}

.ax-pv .lb{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:8px}
.cel-pv{width:300px;height:620px;margin:0 auto;border-radius:38px;background:#0c0a08;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.cel-pv .sc{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#efe6d2;color:#1f1a14;font:12px/1.45 system-ui,sans-serif;position:relative;display:flex;flex-direction:column}
.cel-pv .sc:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px rgba(120,80,20,.22)}
.cel-pv .tp{display:flex;justify-content:space-between;font-size:7px;letter-spacing:.18em;text-transform:uppercase;border-top:1px solid #1f1a1488;border-bottom:1px solid #1f1a1488;padding:3px 0;margin:18px 12px 0}
.cel-pv .ms{text-align:center;border-bottom:3px double #1f1a14;margin:0 12px;padding:6px 0 6px}
.cel-pv .ms b{display:block;font:700 26px/0.95 "Cormorant Garamond",Georgia,serif;text-transform:uppercase}.cel-pv .ms i{font:italic 11px "Cormorant Garamond",Georgia,serif;color:#1f1a14bb}
.cel-pv .bd{flex:1;overflow:hidden;padding:9px 12px}
.cel-pv .k{font-size:7px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#8a5a14;margin-bottom:3px}
.cel-pv h4{font:700 19px/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 4px}
.cel-pv .ln{font:italic 11px/1.25 "Cormorant Garamond",Georgia,serif;color:#1f1a14cc;margin-bottom:6px}
.cel-pv .im{width:100%;height:110px;object-fit:cover;object-position:50% 22%;border:1px solid #1f1a14aa;display:block;background:#1f1a14}
.cel-pv .tx{font-size:9.5px;column-count:2;column-gap:10px;column-rule:1px solid #1f1a1430;margin-top:6px}
.cel-pv .st{border-top:1px solid #1f1a1440;padding:6px 0}.cel-pv .st h5{font:700 14px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 2px}.cel-pv .st p{font-size:9.5px;margin:0;color:#1f1a14cc}
.cel-pv .nv{height:44px;border-top:3px double #1f1a14;display:flex;justify-content:space-around;align-items:center;font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1f1a1477}.cel-pv .nv .on{color:#1f1a14}
.cel-pv .cp{display:flex;gap:9px;align-items:baseline;border-bottom:1px solid #1f1a1430;padding:7px 0}.cel-pv .cp b{font:700 22px/0.9 "Cormorant Garamond",Georgia,serif;width:18px}.cel-pv .cp h5{font:700 14px/1.1 "Cormorant Garamond",Georgia,serif;margin:0}.cel-pv .cp p{font-size:9px;margin:2px 0 0;color:#1f1a14bb}
.cel-pv .cp .pl{margin-left:auto;font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid #8a5a14;color:#8a5a14;padding:2px 4px;white-space:nowrap;align-self:center}
.cel-pv .cp .pl.lancado{background:#1f1a14;color:#efe6d2;border-color:#1f1a14}
.cel-pv .ig{border:1px solid #1f1a14;background:#f6efdf;padding:7px;margin-top:4px}.cel-pv .ig img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.cel-pv .ig p{font-size:9.5px;margin:5px 0 0}
.cel-pv.lock .sc{background:radial-gradient(80% 60% at 50% 30%,#3a2a12,#0b0805);color:#fff}
.cel-pv.lock .sc:after{display:none}.cel-pv .hr{text-align:center;margin-top:60px;font:300 52px/1 system-ui}.cel-pv .dt{text-align:center;font-size:12px;opacity:.75}
.cel-pv .nt{margin:40px 10px 0;background:rgba(239,230,210,.94);color:#1f1a14;border-radius:16px;padding:10px 12px;display:flex;gap:9px}
.cel-pv .nt .ic{width:30px;height:30px;border-radius:8px;background:#1f1a14 url(/icone.png) center/cover;flex:none}
.cel-pv .nt b{display:block;font-size:11px}.cel-pv .nt small{font-size:10px;color:#1f1a1499}.cel-pv .nt p{margin:2px 0 0;font-size:11px;line-height:1.35}
</style>`);



// ---------- 🤝 Testadores da Play Store (inscritos pela página /testar do site)
let TST=null;
async function apTstCarrega(){try{TST=(await api('/api/conteudo',{acao:'testadores'})).lista||[]}catch(e){TST={erro:e.message}}if(APT=='testadores')render()}
function apTstCopia(){const t=(TST||[]).map(x=>x.email).join(', ');navigator.clipboard.writeText(t).then(()=>alert(TST.length+' e-mails copiados. Cole em Play Console › Teste fechado › Testadores › Lista de e-mails.'),()=>prompt('Copie os e-mails:',t))}
async function apTstRm(email){if(!(await confirma('Remover '+email+' da lista?','Remover')))return;await api('/api/conteudo',{acao:'remover_testador',email});apTstCarrega()}
async function apTstLinks(){const g=($('#tst-g').value||'').trim(),t=($('#tst-t').value||'').trim();AP.site=AP.site||{};AP.site.grupo=g;AP.site.teste=t;const b=$('#tst-sv');b.disabled=true;b.textContent='Salvando…';try{await apSalva()}catch(e){alert(e.message)}}
function apTestadores(){if(TST===null){apTstCarrega();return '<div class="ax-sec"><div class="ax-empty">Carregando os testadores…</div></div>'}
 if(TST.erro)return `<div class="ax-sec"><div class="ax-empty">${esc2(TST.erro)}</div></div>`;
 const n=TST.length,falta=Math.max(0,12-n),pct=Math.min(100,Math.round(n/15*100)),site=AP.site||{};
 return `<div class="ax-sec"><h3>Testadores da Play Store</h3><p class="d">A Play Store só libera o app depois de <b>12 testadores</b> inscritos por <b>14 dias seguidos</b> no teste fechado. As pessoas se inscrevem na página <a href="https://miados-do-destino.vercel.app/testar/" target="_blank">miados-do-destino.vercel.app/testar</a> (divulgue esse link).</p>
  <div class="tst-meta"><b>${n}</b> inscrito${n==1?'':'s'} · ${falta?`faltam <b>${falta}</b> para 12 (bom ter uns 15)`:'✅ já passou de 12'}<div class="tst-barra"><i style="width:${pct}%"></i></div></div>
  <div class="r sp"><button class="pr" onclick="apTstCopia()" ${n?'':'disabled'}>📋 Copiar todos os e-mails</button><button onclick="TST=null;render()">🔄 Atualizar</button></div>
  <p class="mut" style="font-size:13px">Depois de colar na Play Console, clique em Salvar lá. Quem já está na lista pode abrir o link do teste e instalar.</p></div>
 <div class="ax-sec"><h3>Links que aparecem na página /testar</h3><p class="d">Copie da Play Console. Sem eles, a página só recolhe os e-mails.</p>
  <label class="ax-f"><span>Link de participação do teste fechado</span><input id="tst-t" value="${esc2(site.teste)}" placeholder="https://play.google.com/apps/testing/com.canteiro.miadosdodestino"></label>
  <label class="ax-f"><span>Grupo do Google dos testadores (opcional)</span><input id="tst-g" value="${esc2(site.grupo)}" placeholder="https://groups.google.com/g/…"></label>
  <button class="pr" id="tst-sv" onclick="apTstLinks()">Salvar links</button></div>
 <div class="ax-sec"><h3>Inscritos</h3>${n?`<table class="tst-t"><tr><th>Nome</th><th>E-mail</th><th>Quando</th><th></th></tr>${TST.map(x=>`<tr><td>${esc2(x.nome)||'—'}</td><td>${esc2(x.email)}</td><td>${new Date(x.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td><button class="ax-ib x" onclick="apTstRm('${esc2(x.email)}')">✕</button></td></tr>`).join('')}</table>`:'<div class="ax-empty">Ninguém se inscreveu ainda. Divulgue a página /testar no Instagram.</div>'}</div>`}
document.head.insertAdjacentHTML('beforeend',`<style>.tst-meta{font-size:15px;margin:10px 0 4px}.tst-meta b{color:var(--gd);font-size:20px}.tst-barra{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}.tst-barra i{display:block;height:100%;background:linear-gradient(90deg,#b8892c,#f3d98f)}.tst-t td{font-size:14px}</style>`);


// ---------- 📲 TikTok e Kwai: fila diária com os posts do Instagram, sem repetir
let RD2=null,RDF='fila',RDB='';
const RD_TT={PUBLISH_COMPLETE:'✅ Publicado no TikTok',SEND_TO_USER_INBOX:'📥 Na caixa de entrada do TikTok: toque na notificação e publique',FAILED:'❌ O TikTok recusou',PROCESSING_UPLOAD:'⏳ Enviando para o TikTok',PROCESSING_DOWNLOAD:'⏳ O TikTok está baixando as fotos'};
const textos2=l=>(String(l||'').split('\n').find(x=>x.trim())||'').slice(0,70);
const RD_EST={fila:['⏳','Na fila'],postado:['✅','Postado'],ja_tinha:['☑️','Já estava lá'],pular:['⏭️','Pular']};
async function rdCarrega(){try{RD2=await api('/api/redes',{acao:'estado'})}catch(e){RD2={erro:e.message}}if(tab=='redes')render()}
async function rdAcao(corpo,msg){RDB=msg||'…';render();try{const d=await api('/api/redes',corpo);RDB='';await rdCarrega();return d}catch(e){RDB='';render();alert(e.message)}}
async function rdAtualiza(){const d=await rdAcao({acao:'atualizar'},'Puxando os posts do Instagram…');if(d)alert(`${d.total} posts na lista · ${d.novos} novo(s)${d.jaTinha?` · ${d.jaTinha} já estava(m) no TikTok`:''}`)}
const rdMarca=(id,rede,estado)=>rdAcao({acao:'marcar',id,rede,estado});
async function rdAgora(id){if(!(await confirma('Publicar este post no TikTok agora?','Publicar',false)))return;const d=await rdAcao({acao:'publicar_agora',id},'Publicando no TikTok…');if(d)alert('Enviado para o TikTok.')}
async function rdLogin(){const d=await rdAcao({acao:'tiktok_login'});if(d&&d.url)location.href=d.url}
async function rdVerif(){const n=($('#rd-vn').value||'').trim(),c=($('#rd-vc').value||'').trim();const d=await rdAcao({acao:'tiktok_verificacao',nome:n,conteudo:c});if(d)alert('Pronto. No TikTok for Developers, verifique o prefixo:\n'+d.url.replace(/[^/]*$/,''))}
async function rdBaixa(it){RDB='Preparando os arquivos…';render();try{const m=await api('/api/redes',{acao:'midia',id:it.id});if(m.video)window.open(m.video,'_blank');for(const[i,u]of m.fotos.entries()){const r=await fetch(u);if(!r.ok)throw new Error('Não consegui baixar a foto '+(i+1)+' ('+r.status+')');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='miados-'+it.id+(m.fotos.length>1?'-'+(i+1):'')+'.jpg';a.click();await new Promise(z=>setTimeout(z,400))}}catch(e){alert(e.message)}RDB='';render()}
function rdCopia(id){const it=RD2.fila.find(x=>x.id==id);navigator.clipboard.writeText(it.legenda||'').then(()=>alert('Legenda copiada.'),()=>prompt('Copie a legenda:',it.legenda))}
function redes(){if(!RD2){rdCarrega();return '<div class="ax-sec"><div class="ax-empty">Carregando a fila…</div></div>'}
 if(RD2.erro)return `<div class="ax-sec"><div class="ax-empty">${esc2(RD2.erro)}</div></div>`;
 const f=RD2.fila||[],cont=r=>Object.fromEntries(Object.keys(RD_EST).map(k=>[k,f.filter(x=>(x[r]?.estado||'fila')==k).length]));
 const ct=cont('tiktok'),ck=cont('kwai'),prox=r=>f.find(x=>(x[r]?.estado||'fila')=='fila'),hojeK=f.find(x=>x.kwai?.dia==new Date(Date.now()-3*3600e3).toISOString().slice(0,10)&&x.kwai.estado=='fila')||prox('kwai');
 const tk=RD2.tiktok,priv=tk&&!(tk.privacidades||[]).includes('PUBLIC_TO_EVERYONE');
 const card=(it,rede)=>it?`<div class="rd-card"><a href="${esc2(it.link)}" target="_blank" class="rd-th">${it.tipo=='foto'||it.tipo=='carrossel'?`<img src="/midia/${it.id}_0.jpg" loading="lazy" alt="">`:'<span>🎬</span>'}</a><div><small>${({foto:'Foto',carrossel:'Carrossel',reels:'Reels',video:'Vídeo'})[it.tipo]||''} · ${new Date(it.data).toLocaleDateString('pt-BR')}</small><p>${esc2((it.legenda||'(sem legenda)').slice(0,140))}</p></div></div>`:'<div class="ax-empty">Fila vazia 🎉</div>';
 const lista=f.filter(x=>RDF=='fila'?((x.tiktok?.estado||'fila')=='fila'||(x.kwai?.estado||'fila')=='fila'):RDF=='feitos'?!((x.tiktok?.estado||'fila')=='fila'&&(x.kwai?.estado||'fila')=='fila'):true);
 const sel=(it,r)=>`<select onchange="rdMarca('${it.id}','${r}',this.value)">${Object.entries(RD_EST).map(([k,[i,l]])=>`<option value="${k}" ${(it[r]?.estado||'fila')==k?'selected':''}>${i} ${l}</option>`).join('')}</select>`;
 return `<div class="ax-top"><div><h2>📲 TikTok e Kwai</h2><p>Todo dia sai post do Instagram no TikTok (1 a 3 por dia), sem repetir. O TikTok publica sozinho; o Kwai avisa no celular para você postar.</p></div>
  <div class="ax-topd">${RDB?`<span class="ax-st suj"><i></i>${esc2(RDB)}</span>`:`<label class="ax-st" style="cursor:pointer"><input type="checkbox" ${RD2.config?.ativo!==false?'checked':''} onchange="rdAcao({acao:'config',config:{...RD2.config,ativo:this.checked}})"> Automação ${RD2.config?.ativo!==false?'ligada':'pausada'}</label>`}<button onclick="rdAtualiza()">🔄 Puxar posts do Instagram</button></div></div>
 ${!f.length?`<div class="ax-sec"><div class="ax-empty">A fila está vazia. Toque em <b>🔄 Puxar posts do Instagram</b> para montar a fila${tk?' (ele também compara com o que já está no seu TikTok)':''}.</div></div>`:''}
  <div class="ax-sec"><h3>🎵 TikTok</h3>
   ${tk?`<p class="d">Conectado: <b>${esc2(tk.nome||tk.usuario||'conta TikTok')}</b>${priv?' · <span class="dn">até o TikTok aprovar o app, os posts chegam como <b>rascunho</b> na caixa de entrada do TikTok: toque na notificação e publique</span>':''}</p>${(tk.escopos||'').includes('video.upload')?'':`<p class="d dn">Falta a permissão de rascunho: conecte de novo.</p><button class="pr" onclick="rdLogin()">Conectar TikTok de novo</button>`}`:RD2.app?`<p class="d">Falta conectar a conta.</p><button class="pr" onclick="rdLogin()">Conectar TikTok</button>`:'<p class="d">Falta criar o app no TikTok for Developers (veja “Configurar o TikTok” abaixo).</p>'}
   <label class="ax-f" style="max-width:320px;margin:8px 0"><span>Posts por dia no TikTok</span><select onchange="rdAcao({acao:'config',config:{...RD2.config,tiktokPorDia:+this.value}})">${[[1,'1 · 12h'],[2,'2 · 12h e 19h'],[3,'3 · 12h, 16h e 19h']].map(([v,l])=>`<option value="${v}" ${(RD2.config?.tiktokPorDia||1)==v?'selected':''}>${l}</option>`).join('')}</select></label>
   ${f.filter(x=>x.tiktok?.publish_id).sort((a,b)=>new Date(b.tiktok.quando)-new Date(a.tiktok.quando)).slice(0,3).map(x=>`<div class="rd-st"><b>${RD_TT[x.tiktok.status]||'⏳ Processando no TikTok'}</b>${x.tiktok.erro?` · ${esc2(x.tiktok.erro)}`:''}<small>${esc2(textos2(x.legenda))}</small></div>`).join('')}
   <div class="rd-n"><span>⏳ ${ct.fila} na fila</span><span>✅ ${ct.postado} postados</span><span>☑️ ${ct.ja_tinha} já estavam lá</span></div>
   <div class="mut" style="font-size:12px;margin:10px 0 4px">PRÓXIMO</div>${card(prox('tiktok'))}
   ${tk&&prox('tiktok')?`<button style="margin-top:8px" onclick="rdAgora('${prox('tiktok').id}')">🚀 Publicar este agora</button>`:''}</div>
 ${f.length?`<div class="ax-sec"><h3>Fila</h3><p class="d">O que já foi postado ou já estava no TikTok/Kwai fica marcado e não sai de novo. Marque “Já estava lá” nos posts que vocês já colocaram no Kwai.</p>
  <div class="ax-tabs" style="display:flex!important;grid-template-columns:none">${[['fila','Na fila'],['feitos','Já foram'],['todos','Todos']].map(([k,l])=>`<button class="${RDF==k?'on':''}" onclick="RDF='${k}';render()" style="min-height:0!important;flex-direction:row!important">${l}</button>`).join('')}</div>
  <div class="rd-lista">${lista.slice(0,80).map((it,i)=>`<div class="rd-it"><a href="${esc2(it.link)}" target="_blank" class="rd-th">${it.tipo=='foto'||it.tipo=='carrossel'?`<img src="/midia/${it.id}_0.jpg" loading="lazy" alt="">`:'<span>🎬</span>'}</a>
   <div class="rd-tx"><small>${({foto:'Foto',carrossel:'Carrossel',reels:'Reels',video:'Vídeo'})[it.tipo]||''} · ${new Date(it.data).toLocaleDateString('pt-BR')} · ❤️ ${it.engaj}</small><p>${esc2((it.legenda||'(sem legenda)').slice(0,110))}</p></div>
   <div class="rd-sel"><label>TikTok ${sel(it,'tiktok')}</label><label>Kwai ${sel(it,'kwai')}</label><div><button class="ax-ib" title="Para o topo da fila" onclick="rdAcao({acao:'mover',id:'${it.id}',posicao:'topo'})">⤒</button><button class="ax-ib" title="Para o fim da fila" onclick="rdAcao({acao:'mover',id:'${it.id}',posicao:'fim'})">⤓</button></div></div></div>`).join('')||'<div class="ax-empty">Nada aqui.</div>'}</div></div>`:''}
 ${(RD2.log||[]).length?`<div class="ax-sec"><h3>Histórico</h3><div class="ax-hist">${RD2.log.slice(0,15).map(l=>`<div class="ax-h"><div class="ic">${l.rede=='tiktok'?'🎵':l.rede=='kwai'?'🎬':'📋'}</div><div><div>${esc2(l.texto)}</div><small>${new Date(l.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</small></div></div>`).join('')}</div></div>`:''}
 <div class="ax-sec"><h3>🎬 Kwai</h3><p class="d">O Kwai não deixa publicar por automação: aqui fica o post de hoje pronto para postar.</p>
   <div class="rd-n"><span>⏳ ${ck.fila} na fila</span><span>✅ ${ck.postado} postados</span><span>☑️ ${ck.ja_tinha} já estavam lá</span></div>
   <div class="mut" style="font-size:12px;margin:10px 0 4px">POST DE HOJE</div>${card(hojeK)}
   ${hojeK?`<div class="r" style="margin-top:8px"><button onclick="rdBaixa({id:'${hojeK.id}'})">⬇️ Baixar ${hojeK.tipo=='reels'||hojeK.tipo=='video'?'vídeo':hojeK.tipo=='carrossel'?'fotos':'imagem'}</button><button onclick="rdCopia('${hojeK.id}')">📋 Copiar legenda</button><button class="pr" onclick="rdMarca('${hojeK.id}','kwai','postado')">✅ Postei</button></div>`:''}
   <label class="ax-sw" style="margin-top:12px"><input type="checkbox" ${RD2.config?.kwaiAviso!==false?'checked':''} onchange="rdAcao({acao:'config',config:{...RD2.config,kwaiAviso:this.checked}})"><span class="t"></span><div><b>Avisar no celular</b><small>Notificação ao meio-dia nos aparelhos da equipe (aba App › Aparelhos).</small></div></label></div>
 <details class="ax-sec"><summary><b>⚙️ Configurar o TikTok</b> (uma vez)</summary>
  <ol class="rd-passos"><li>Entre em <a href="https://developers.tiktok.com/apps" target="_blank">developers.tiktok.com</a> com a conta do TikTok da série e crie um app.</li>
   <li>Adicione os produtos <b>Login Kit</b> e <b>Content Posting API</b> (ative <b>Direct Post</b>). Peça os escopos <code>user.info.basic</code>, <code>video.publish</code> e <code>video.list</code>.</li>
   <li>Em Login Kit, cadastre o Redirect URI: <code>https://miadosdodestinocentral.vercel.app/tiktok/retorno</code></li>
   <li>Em Content Posting API › <b>Verify URL properties</b>, escolha “URL prefix” com <code>https://miadosdodestinocentral.vercel.app/midia/</code>. O TikTok vai mostrar um arquivo para baixar: cole o nome e o conteúdo dele aqui embaixo e depois clique em Verify lá.</li>
   <li>Copie o <b>Client key</b> e o <b>Client secret</b> e mande para o Rodrigo cadastrar na Vercel (<code>TIKTOK_CLIENT_KEY</code> e <code>TIKTOK_CLIENT_SECRET</code>).</li>
   <li>Volte aqui e toque em <b>Conectar TikTok</b>. Depois envie o app para <b>auditoria</b> no TikTok (até ela ser aprovada, os posts saem privados).</li></ol>
  <div class="ax-2"><label class="ax-f"><span>Nome do arquivo de verificação</span><input id="rd-vn" value="${esc2(RD2.verificacao)}" placeholder="tiktokXXXX.txt"></label><label class="ax-f"><span>Conteúdo do arquivo</span><input id="rd-vc" placeholder="tiktok-developers-site-verification=…"></label></div>
  <button onclick="rdVerif()">Salvar arquivo de verificação</button>${tk?` <button onclick="rdAcao({acao:'tiktok_sair'})">Desconectar TikTok</button>`:''}</details>`}
document.head.insertAdjacentHTML('beforeend',`<style>
.rd-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.rd-g{grid-template-columns:1fr}}
.rd-n{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.rd-n span{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 10px}
.rd-card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}

const podeVer=k=>k=='memes'?(ME.menus.includes('publicar')||ME.menus.includes('posts')):k=='redes'?ME.menus.includes('publicar'):ME.menus.includes(k);
const MM_PERS=[['','Sem personagem'],['naru','Naru'],['zelda','Zelda'],['merlin','Merlin'],['spark','Spark'],['yoonari','Yoo Nari'],['baek','Sr. Baek']];
const MM_FMT={ninguem:['😐','Ninguém:'],classico:['🔠','Clássico'],comparacao:['⚖️','Comparação'],pov:['👀','POV']};
let MM={enviadas:[],fmt:'ninguem',pers:'naru',cena:'',cena2:'',topo:'',baixo:'',tam:'vertical',imgs:[],imgs2:[],sel:0,sel2:0,busy:'',ideias:[],chave:null,erro:''};
async function mmStatus(){try{const d=await api('/api/meme',{acao:'status'});MM.chave=d.chave;MM.modelo=d.modelo||''}catch(e){MM.chave=false}if(tab=='memes')render()}
function memes(){if(MM.chave===null)mmStatus();const c=MM.fmt=='comparacao',f=MM_FMT;
 const lbl={ninguem:['Depois de “Ninguém:”','Ex.: A Naru às 3h da manhã:'],classico:['Texto de cima','Ex.: QUANDO O SR. BAEK DIZ'],comparacao:['Rótulo do 1º quadro','Ex.: Todo dorama:'],pov:['Texto do POV','Ex.: você é o gato e viu TUDO']}[MM.fmt];
 const lbl2={classico:['Texto de baixo','Ex.: QUE NÃO É NADA'],comparacao:['Rótulo do 2º quadro','Ex.: Miados do Destino:']}[MM.fmt];
 return `<div class="ax-top"><div><h2>🎭 Estúdio de memes</h2><p>Gere a imagem com IA grátis, escreva o texto e baixe o meme pronto com a marca.</p></div>
  <span class="ax-st${MM.chave?'':' suj'}"><i></i>${MM.chave?'IA de imagem: '+esc2(MM.modelo)+(MM.pers?' · com a foto do personagem':''):MM.chave===false?'IA de imagem: modo público (mais simples)':'Verificando a IA…'}</span></div>
 <div class="mm"><div>

   <button class="ax-add" onclick="mmIdeias()" ${MM.busy?'disabled':''}>${MM.busy=='ideias'?'⏳ Pensando…':'💡 Me dá 5 ideias de meme'}</button>
   ${MM.ideias.length?`<div class="mm-ideias">${MM.ideias.map((x,i)=>`<button onclick="mmUsa(${i})"><b>${f[x.formato][0]} ${esc2(x.formato=='ninguem'?'Ninguém: / '+x.topo:x.topo+(x.baixo?' / '+x.baixo:''))}</b><small>${esc2(x.cena)}</small></button>`).join('')}</div>`:''}</div>
  <div class="ax-sec"><h3>2. A imagem</h3><p class="d">Descreva a cena em português. A IA da Central escreve o prompt em inglês para você${MM.pers?' e usa a foto oficial do personagem como referência':''}.</p>
   <label class="ax-f"><span>${c?'Cena do 1º quadro':'Cena'}</span><textarea id="mm-c" placeholder="Ex.: a Naru sentada no corredor escuro, encarando a câmera com cara de quem sabe de tudo">${esc2(MM.cena)}</textarea></label>
   ${c?`<label class="ax-f"><span>Cena do 2º quadro</span><textarea id="mm-c2" placeholder="Ex.: a Naru ao lado da Yoo Nari assustada">${esc2(MM.cena2)}</textarea></label>`:''}
   <div class="r"><button class="pr" onclick="mmGera()" ${MM.busy?'disabled':''}>${MM.busy=='gerar'?'⏳ Gerando… (de 10 s a 1 min)':'✨ Gerar 2 opções'}</button><label class="mm-up">📁 Usar minha imagem<input type="file" accept="image/*" hidden onchange="mmUp(this.files[0])"></label></div>
   ${MM.erro?`<p class="dn">${esc2(MM.erro)}</p>`:''}
   ${MM.imgs.length?`<div class="mm-ops">${MM.imgs.map((u,i)=>`<img src="${u}" class="${MM.sel==i?'on':''}" onclick="MM.sel=${i};mmDesenha();render()">`).join('')}</div>`:''}
   ${c&&MM.imgs2.length?`<p class="mut" style="margin:10px 0 4px">2º quadro</p><div class="mm-ops">${MM.imgs2.map((u,i)=>`<img src="${u}" class="${MM.sel2==i?'on':''}" onclick="MM.sel2=${i};mmDesenha();render()">`).join('')}</div>`:''}</div>

 </div>
 <div class="mm-pv"><div class="lb">Prévia</div><canvas id="mm-cv"></canvas>

function mmSalva(){const v=id=>{const e=$('#'+id);return e?e.value:null};if(v('mm-c')!==null)MM.cena=v('mm-c');if(v('mm-c2')!==null)MM.cena2=v('mm-c2');if(v('mm-t')!==null)MM.topo=v('mm-t');if(v('mm-b')!==null)MM.baixo=v('mm-b')}
function mmIdeiasLimpa(){mmSalva();MM.ideias=[];render()}
async function mmIdeias(){mmSalva();MM.busy='ideias';MM.erro='';render();try{MM.ideias=(await api('/api/meme',{acao:'ideias',personagem:MM.pers})).ideias}catch(e){MM.erro=e.message}MM.busy='';render()}
function mmUsa(i){const x=MM.ideias[i];Object.assign(MM,{fmt:x.formato,cena:x.cena,cena2:x.formato=='comparacao'?x.cena:'',topo:x.topo,baixo:x.baixo});render();mmDesenha()}
async function mmGera(){mmSalva();if(!MM.cena.trim())return alert('Descreva a cena da imagem.');const c=MM.fmt=='comparacao';if(c&&!MM.cena2.trim())return alert('Descreva também o 2º quadro.');
 MM.busy='gerar';MM.erro='';render();
 const g=cena=>api('/api/meme',{acao:'gerar',cena,personagem:MM.pers,formato:c?'quadrado':MM.tam}).then(d=>{if(d.aviso)MM.erro=d.aviso;return d.img});
 try{const pedidos=[MM.cena,MM.cena,...(c?[MM.cena2,MM.cena2]:[])],r=[];
  // um de cada vez (o gerador grátis recusa pedidos simultâneos) e uma nova tentativa se falhar
  for(const cena of pedidos){let v=null,er=null;for(let t=0;t<2&&!v;t++){try{v=await g(cena)}catch(e){er=e;await new Promise(z=>setTimeout(z,1500))}}r.push(v?{status:'fulfilled',value:v}:{status:'rejected',reason:er})}
  const ok=r.map(x=>x.status=='fulfilled'?x.value:null);
  MM.imgs=ok.slice(0,2).filter(Boolean);MM.imgs2=c?ok.slice(2).filter(Boolean):[];MM.sel=0;MM.sel2=0;
  if(!MM.imgs.length)MM.erro=(r.find(x=>x.status=='rejected')||{}).reason?.message||'Não foi possível gerar. Tente de novo.'}catch(e){MM.erro=e.message}
 MM.busy='';render();mmDesenha()}
function mmUp(f){if(!f)return;mmSalva();const fr=new FileReader();fr.onload=()=>{MM.enviadas.push(fr.result);if(MM.fmt=='comparacao'&&MM.imgs.length&&!MM.imgs2.length){MM.imgs2=[fr.result];MM.sel2=0}else{MM.imgs=[fr.result];MM.sel=0}render();mmDesenha()};fr.readAsDataURL(f)}
const mmImg=src=>new Promise((ok,er)=>{const i=new Image();i.onload=()=>{i.mmGerada=!MM.enviadas.includes(src);ok(i)};i.onerror=er;i.src=src});
// corta 6% de baixo da imagem gerada (onde o gerador público põe a marca dele)
function mmCobre(c,img,x,y,w,h){const ih=img.height*(img.mmGerada?.94:1),k=Math.max(w/img.width,h/ih),sw=w/k,sh=h/k;c.drawImage(img,(img.width-sw)/2,(ih-sh)*.35,sw,sh,x,y,w,h)}
function mmLinhas(c,t,max){const out=[];for(const par of String(t).split('\n')){let l='';for(const p of par.split(' ')){const tt=l?l+' '+p:p;if(c.measureText(tt).width>max&&l){out.push(l);l=p}else l=tt}out.push(l)}return out}
function mmContorno(c,t,x,y,size){c.font=`${size}px Anton, Impact, sans-serif`;c.lineJoin='round';c.lineWidth=size*.16;c.strokeStyle='#000';c.fillStyle='#fff';c.strokeText(t,x,y);c.fillText(t,x,y)}
let mmIcone=null;
async function mmDesenha(){const cv=$('#mm-cv');if(!cv)return;const W=1080,H=MM.fmt=='comparacao'?1350:{vertical:1350,quadrado:1080,stories:1920}[MM.tam];cv.width=W;cv.height=H;const c=cv.getContext('2d');
 c.fillStyle='#17130f';c.fillRect(0,0,W,H);
 if(!MM.imgs.length){c.fillStyle='#a8977c';c.font='600 40px system-ui';c.textAlign='center';c.fillText('A prévia aparece aqui',W/2,H/2);return}
 await document.fonts.load('80px Anton').catch(()=>{});
 const img=await mmImg(MM.imgs[MM.sel]);c.textAlign='left';c.textBaseline='alphabetic';
 if(MM.fmt=='ninguem'){c.fillStyle='#fff';c.fillRect(0,0,W,H);c.font='700 58px system-ui, Arial';c.fillStyle='#111';const ls=['Ninguém:','',...mmLinhas(c,MM.topo||'…',W-120)];ls.forEach((l,i)=>c.fillText(l,60,95+i*70));const top=95+ls.length*70;mmCobre(c,img,0,top,W,H-top)}
 else if(MM.fmt=='comparacao'){c.fillStyle='#fff';c.fillRect(0,0,W,H);const img2=MM.imgs2[MM.sel2]?await mmImg(MM.imgs2[MM.sel2]):img;c.font='700 52px system-ui, Arial';c.fillStyle='#111';
  c.fillText(MM.topo||'Todo dorama:',50,80);c.save();c.beginPath();c.roundRect(50,110,W-100,520,18);c.clip();mmCobre(c,img,50,110,W-100,520);c.restore();
  c.fillText(MM.baixo||'Miados do Destino:',50,710);c.save();c.beginPath();c.roundRect(50,740,W-100,540,18);c.clip();mmCobre(c,img2,50,740,W-100,540);c.restore()}
 else{mmCobre(c,img,0,0,W,H);c.textAlign='center';
  if(MM.fmt=='pov'){const t='POV: '+(MM.topo||'…');c.font='700 54px system-ui, Arial';const ls=mmLinhas(c,t,W-200),lh=68,bh=ls.length*lh+40,y0=H*.12;c.fillStyle='#fff';c.beginPath();c.roundRect(80,y0,W-160,bh,22);c.fill();c.fillStyle='#111';ls.forEach((l,i)=>c.fillText(l,W/2,y0+62+i*lh))}
  else{const up=t=>String(t||'').toUpperCase();c.font='96px Anton, Impact';let ls=mmLinhas(c,up(MM.topo),W-100);ls.forEach((l,i)=>mmContorno(c,l,W/2,130+i*104,96));ls=mmLinhas(c,up(MM.baixo),W-100);ls.forEach((l,i)=>mmContorno(c,l,W/2,H-90-(ls.length-1-i)*104,96))}}
 if(!mmIcone)mmIcone=await mmImg('/icone.png').catch(()=>null);
 const fundoClaro=MM.fmt=='ninguem'||MM.fmt=='comparacao';c.textAlign='right';c.font='600 24px system-ui, Arial';const tx='@miadosdodestino',tw=c.measureText(tx).width;
 if(!fundoClaro){c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.roundRect(W-tw-98,H-74,tw+70,48,24);c.fill()}
 c.fillStyle=fundoClaro?'#5a4320':'#f3d98f';c.fillText(tx,W-40,H-41);if(mmIcone){c.save();c.beginPath();c.arc(W-tw-66,H-50,17,0,7);c.clip();c.drawImage(mmIcone,W-tw-83,H-67,34,34);c.restore()}}
function mmBaixa(){const cv=$('#mm-cv');if(!cv)return;const a=document.createElement('a');a.href=cv.toDataURL('image/jpeg',.93);a.download='meme-miados-'+new Date().toISOString().slice(0,10)+'-'+Date.now().toString(36).slice(-4)+'.jpg';a.click()}

  ${id=='milka'?`<p class="ax-dica">${v?'✅ O vídeo da Milka está pronto. Depois de salvar, avise quem pediu: <button onclick="APDEST=\'milka\';APT=\'notif\';AP._pt=\'O vídeo da Milka chegou 🐈\';AP._px=\'A quinta gata finalmente se apresenta. Toque para assistir.\';render()">🔔 Avisar quem pediu</button>':'A Milka já tem lugar pronto: cole o link e envie a foto dela quando quiserem. Enquanto o enigma não for revelado, ela não aparece em lugar nenhum do app nem do site (nome, foto, vídeo e papel de parede ficam escondidos).'}</p>`:''}`}).join('')}</div>`}
async function apSobeImg(f,w,h,nome,y=.5){const i=await new Promise((ok,er)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=er;im.src=URL.createObjectURL(f)});const c=document.createElement('canvas');c.width=w;c.height=h;const k=Math.max(w/i.width,h/i.height),sw=w/k,sh=h/k;c.getContext('2d').drawImage(i,(i.width-sw)/2,(i.height-sh)*y,sw,sh,0,0,w,h);return (await api('/api/upload',{acao:'enviar',nome,dados:c.toDataURL('image/jpeg',.88).split(',')[1]})).url}

 if($('#am-t')){g.edicao=v('ag-ed');Object.assign(g.manchete,{kicker:v('am-k'),titulo:v('am-t'),linha:v('am-s'),texto:v('am-x'),img:v('am-i'),legenda:v('am-l')});g.materias=g.materias.map((x,i)=>$('#mt-t'+i)?{kicker:v('mt-k'+i),titulo:v('mt-t'+i),texto:v('mt-x'+i),link:v('mt-l'+i),linkTxt:v('mt-lt'+i)}:x)}
 if($('#tp-t0')||APT=='temporada')AP.temporada=AP.temporada.map((x,i)=>$('#tp-t'+i)?{n:i+1,titulo:v('tp-t'+i),sinopse:v('tp-x'+i),status:v('tp-s'+i)||'producao',data:v('tp-d'+i)}:x);

async function apSalva(){apSalvaTela();const b=$('#ap-sv');b.disabled=true;b.textContent='Publicando…';try{const{recentes,post,...pd}=AP.postDoDia||{};const{_pt,_px,...resto}=AP;const cr=resto.creditos?{...resto.creditos,pessoas:(resto.creditos.pessoas||[]).map(({foto,...p})=>p)}:undefined;await api('/api/conteudo',{acao:'salvar',conteudo:{...resto,creditos:cr,postDoDia:pd}});AP=null;await apCarrega()}catch(e){alert('Não foi possível salvar: '+e.message);b.disabled=false;b.textContent='Salvar e publicar no app'}}
async function apPush(){const t=($('#pu-t').value||'').trim(),x=($('#pu-x').value||'').trim();if(!t||!x)return alert('Preencha o título e a mensagem.');
 let alvo,nome;if(APDEST=='todos'){alvo={topico:'gazeta'};nome='todos que têm o app'}else if(APDEST=='milka'){alvo={topico:'milka'};nome='quem pediu aviso do vídeo da Milka'}else if(APDEST=='ep'){const s=$('#pu-ep');alvo={topico:s.value};nome='quem pediu lembrete do '+s.selectedOptions[0].textContent}else{const s=$('#pu-ap');if(!s)return alert('Nenhum aparelho de teste.');alvo={aparelho:s.value};nome='o aparelho '+s.selectedOptions[0].textContent}
