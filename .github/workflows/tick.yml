# Fila de esperas do bot: chama /api/webhook?tick=1 a cada 15 minutos (o banco grátis da Central dorme quando ninguém usa).
# Saiu do vercel.json porque o plano Hobby da Vercel só aceita cron uma vez por dia.
# O GitHub costuma atrasar alguns minutos; o QStash (lib/bot.js) e os próprios webhooks da Meta também rodam o tick.
name: Tick do bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 90 'https://miadosdodestinocentral.vercel.app/api/webhook?tick=1'
